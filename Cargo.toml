[package]
name = "axis"
version = "0.2.0"
edition = "2024"
description = "Axis programming language compiler and runtime — a backend API language for small LLMs"
license = "MIT"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
lsp-server = "0.7"
lsp-types = "0.97"
notify = "7"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "uuid", "chrono", "rust_decimal"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tower = { version = "0.5" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
object_store = { version = "0.14", default-features = false, features = ["aws"] }
infer = "0.19"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
redis-port = ["redis"]

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
http-body-util = "0.1"
hyper = "1"

[[bin]]
name = "axis"
path = "src/main.rs"

[lib]
name = "axis"
path = "src/lib.rs"

[profile.release]
lto = true
strip = true
codegen-units = 1
