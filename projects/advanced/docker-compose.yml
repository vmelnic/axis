services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=axis
      - POSTGRES_PASSWORD=axis
      - POSTGRES_DB=axis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
